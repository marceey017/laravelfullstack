name: Bootstrap Laravel 12

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Laravel 12 project when missing
        if: hashFiles('composer.json') == ''
        run: |
          composer create-project laravel/laravel:^12.0 /tmp/laravel --prefer-dist --no-interaction
          cp -a /tmp/laravel/. .
          rm -rf /tmp/laravel

      - name: Commit generated project
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: scaffold Laravel 12 application"
            git push
          else
            echo "Nothing to commit."
          fi
